# Simple Nginx Configuration for PromoHive
# File: /etc/nginx/sites-available/promohive-simple

server {
    listen 80;
    server_name globalpromonetwork.store www.globalpromonetwork.store;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name globalpromonetwork.store www.globalpromonetwork.store;
    
    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/globalpromonetwork.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalpromonetwork.store/privkey.pem;
    
    # Basic SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://adunits.adgem.com https://www.highperformanceformat.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.adgem.com https://api.cpalead.com https://api.adsterra.com https://adunits.adgem.com https://www.highperformanceformat.com; frame-src 'self' https://api.adgem.com https://adunits.adgem.com https://www.highperformanceformat.com; object-src 'none'; base-uri 'self';" always;
    
    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Main Application
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Static Files Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://localhost:8080;
    }
    
    # File Upload Size
    client_max_body_size 10M;
    
    # Logging
    access_log /var/log/nginx/promohive.access.log;
    error_log /var/log/nginx/promohive.error.log;
}
